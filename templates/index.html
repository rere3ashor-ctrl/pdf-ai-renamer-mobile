<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسمّي ملفات البوستة</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}.c{max-width:800px;margin:auto;padding:20px}.box{background:white;padding:20px;border-radius:16px}input,button{padding:13px;margin:8px 0}input{width:100%;box-sizing:border-box}button,a{border:0;border-radius:9px;padding:11px;background:#222;color:white;text-decoration:none}.r{border-top:1px solid #ddd;padding:13px 0}.s{margin:8px 0}</style><div class="c"><div class="box"><h2>مسمّي ملفات البوستة بالذكاء الاصطناعي</h2><p>اختاري ملف PDF أو عدة ملفات، راجعي الاسم المقترح، ثم احفظي الملف باسمه الجديد.</p><input id="f" type="file" accept=".pdf,application/pdf" multiple><button id="b">تحليل الملفات</button><div id="l"></div></div></div><script>
let fs=[];const f=document.getElementById('f'),l=document.getElementById('l'),b=document.getElementById('b');
const e=s=>(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
f.onchange=()=>{fs=[...f.files];l.innerHTML=fs.map((x,i)=>`<div class=r id=r${i}><b>${e(x.name)}</b><div class=s>جاهز للتحليل</div></div>`).join('')};
b.onclick=async()=>{if(!fs.length)return alert('اختاري PDF أولًا');b.disabled=true;for(let i=0;i<fs.length;i++){let r=document.getElementById('r'+i);r.querySelector('.s').textContent='جارِ التحليل...';let d=new FormData();d.append('file',fs[i]);try{let q=await fetch('/analyze',{method:'POST',body:d}),o=await q.json();if(!q.ok)throw Error(o.error);r.innerHTML=`<b>${e(fs[i].name)}</b><div class=s>الاسم المقترح: <b>${e(o.filename)}</b></div><div class=s>الثقة: ${e(o.confidence)}</div><a id=d${i}>حفظ بالاسم الجديد</a>`;let a=document.getElementById('d'+i);a.href=URL.createObjectURL(fs[i]);a.download=o.filename}catch(x){r.querySelector('.s').textContent='خطأ: '+x.message}}b.disabled=false};
</script></html>
